<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #58a6ff;
    }

    .header span {
      font-size: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 6px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 13px;
      outline: none;
      transition: border 0.2s;
    }

    input:focus {
      border-color: #58a6ff;
    }

    .token-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .token-row input {
      flex: 1;
    }

    .toggle-btn {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #8b949e;
      padding: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }

    .toggle-btn:hover { background: #30363d; }

    button.save {
      width: 100%;
      margin-top: 14px;
      padding: 9px;
      background: #238636;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.save:hover { background: #2ea043; }

    .status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      min-height: 18px;
      color: #3fb950;
    }

    .status.error { color: #f85149; }

    .divider {
      border: none;
      border-top: 1px solid #21262d;
      margin: 14px 0;
    }

    .info {
      font-size: 11px;
      color: #8b949e;
      line-height: 1.5;
    }

    a {
      color: #58a6ff;
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <span>🎌</span>
    <h1>AniWorld → AniList Tracker</h1>
  </div>

  <label>AniList API Token</label>
  <div class="token-row">
    <input type="password" id="tokenInput" placeholder="Hier Token einfügen..." />
    <button class="toggle-btn" id="toggleBtn">👁</button>
  </div>

  <button class="save" id="saveBtn">Speichern</button>
  <button class="save" id="loginBtn">Token bekommen</button>
  <div class="status" id="status"></div>

  <hr class="divider" />
    <br>
    ⏱ Trackt nach <strong>2 Minuten</strong> auf einer Episode-Seite.
  </div>

  <script src="popup.js"></script>
</body>
</html>
